const phonePattern = /^[0-9]{11}$/;
const verificationPattern = /^[0-9]{6}$/;
const rememberedPhoneKey = 'ezv-remember-phone';
function validDemoLogin(phone, code) {
  return phonePattern.test(phone) && verificationPattern.test(code);
}
function canEnterDemo(phone, code) {
  return (phone === '' && code === '') || validDemoLogin(phone, code);
}
function loginCheck(name, label, offIcon, checked = false) {
  return `<label class="login-check">
    <input type="checkbox" name="${name}" ${checked ? 'checked' : ''}>
    <span class="login-check-art" aria-hidden="true">${img(offIcon,17)}${img('login-check-on',17)}</span>
    <span>${E(label)}</span>
  </label>`;
}
function startSession(phone, remember) {
  signed = true;
  sessionStorage.setItem('ezv-session', 'yes');
  sessionStorage.setItem('ezv-session-phone', phone || '13800000000');
  if (remember && phone) localStorage.setItem(rememberedPhoneKey, phone);
  else localStorage.removeItem(rememberedPhoneKey);
  switchTenant('main');
  root('home');
}
function signOut() {
  signed = false;
  sessionStorage.removeItem('ezv-session');
  sessionStorage.removeItem('ezv-session-phone');
  sessionStorage.removeItem('ezv-demo-terms-selected');
  sessionStorage.removeItem('ezv-tenant');
  draft = {};
  root('login');
}
routes.login = () => {
  const remembered = localStorage.getItem(rememberedPhoneKey) || '';
  function submit(event, form) {
    const {phone, code, remember, consent} = form.elements;
    if (!canEnterDemo(phone.value, code.value)) {
      toast('Enter an 11-digit phone number and a 6-digit code.');
      return;
    }
    sessionStorage.setItem('ezv-demo-terms-selected', consent.checked ? 'yes' : 'no');
    startSession(phone.value, remember.checked);
  }
  const langs = () => sheet('Language',['English','简体中文','Bahasa Indonesia'].map(l=>row(l,db.profile.lang===l?'✓':'',()=>{db.profile.lang=l;commit('');render()})).join(''));
  const agreement = () => sheet('Service agreement','<p>This local EZvend workspace stores sample merchant data on this device. Device commands, fees and transfers are simulated. No real payments are processed.</p>'+btn('Done',close));
  return `<div class="panel login">
    <div class="brandbar">${img('logo',44)}<button class="lang" ${action(langs)}>${img('login-language',16)} ${E(db.profile.lang)} ${img('chevron-down',13)}</button></div>
    <h1>Login to Your Account</h1>
    <form novalidate data-demo-login ${action(submit)}>
      <label class="authfield">${img('login-account',18)}
        <input type="tel" name="phone" inputmode="numeric" pattern="[0-9]{11}" autocomplete="off" aria-label="${E(translate('Phone number'))}" placeholder="11-digit phone number" value="${phonePattern.test(remembered)?E(remembered):''}">
      </label>
      <label class="authfield">${img('login-lock',18)}
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="off" aria-label="${E(translate('Verification code'))}" placeholder="6-digit verification code" value="${phonePattern.test(remembered)?'000000':''}">
      </label>
      <div class="authline">${loginCheck('remember','Remember phone number','login-remember-off',phonePattern.test(remembered))}</div>
      <button class="primary" type="submit" data-login-submit>Continue</button>
      <p class="demo-login-hint">Continue directly, or enter any 11-digit number and 6-digit code.</p>
      <div class="terms">
        ${loginCheck('consent','I agree to the service terms','login-consent-off')}
        ${link('Service agreement',agreement)}
      </div>
    </form>
  </div>`;
};
function updateLoginButton(event) {
  const form = event.target.form;
  if (!form?.hasAttribute('data-demo-login')) return;
  form.querySelector('[data-login-submit]').disabled =
    !canEnterDemo(form.elements.phone.value, form.elements.code.value);
}

routes.activate=()=>{const m=makeMachine(0);m.name='';m.address='';return shell('Device Activation',card(form(field('Device number','id','text','','required maxlength="30"')+field('Device IMEI / SN','sn','text','','required maxlength="30"')+sel('Model','model',['G1200 · 2 Doors','G620H · 1 Door'])+sel('Operation scene','scene',['Office','Retail','Campus'])+deviceFields(m),'Save',(e,f)=>{const v=getVals(f);if(d.devices.some(x=>x.id===v.id.trim()||x.sn===v.sn.trim()))throw Error('Device already exists');const dev=makeMachine(v.model.startsWith('G1200')?0:2);Object.assign(dev,v,{id:v.id.trim(),sn:v.sn.trim(),model:v.model.split(' ·')[0]});dev.slots.forEach(s=>s.qty=0);d.devices.push(dev);d.fees.push({id:dev.id,due:0,paid:true});commit('Device activated');go('device',{id:dev.id},true)})))};
routes.config=a=>{const m=findDevice(a.id);return shell('Operational Setup',card(form(deviceFields(m)+sel('Sales Status','selling',['Open','Off Sale'],m.selling?'Open':'Off Sale'),'Save',(e,f)=>{const v=getVals(f);Object.assign(m,v,{selling:v.selling==='Open'});deviceLog(m,'Operational setup updated');commit();back()}))+card(row('Temperature settings',fmtTemp(m.target),()=>go('temperature',a))+row('LED settings',m.light+'%',()=>lightControls(m))))};
routes.temperature=a=>{const m=findDevice(a.id);return shell('Temperature settings',card(row('Cabinet temperature',fmtTemp(m.temp))+row('Past 24 hours','View',()=>sheet('Temperature history',Array.from({length:6},(_,i)=>row(String(i*4).padStart(2,'0')+':00',fmtTemp(m.temp+[0,1,-1,2,0,-1][i]))).join(''))))+card(form(sel('Cooling mode','mode',['Precise','Balanced','Eco'],m.mode)+field('Target temperature (°F)','target','number',m.target,'required min="28" max="65"')+field('Stop selling temperature (°F)','cutoff','number',m.cutoff,'required min="28" max="90"')+field('System volume (%)','volume','number',m.volume,'required min="0" max="100"'),'Save',(e,f)=>{const v=getVals(f);if(+v.cutoff<=+v.target)throw Error('Stop selling temperature must exceed target');Object.assign(m,{mode:v.mode,target:+v.target,cutoff:+v.cutoff,volume:+v.volume});deviceLog(m,'Temperature configuration updated');commit();back()})))};
routes.repair=a=>{const m=findDevice(a.id);return shell('Repair Service',card(form(row('Device',m.name)+row('Location',m.site)+sel('Faulty component','part',['Door lock','Camera','Thermostat','Screen','Other'])+field('Symptoms','symptom','text','','required maxlength="100"')+area('Details','details','','required maxlength="200"')+field('Country','country','text',d.prefs.region,'required')+field('Street address','address','text',m.address,'required')+field('Contact number','phone','tel',m.phone,'required')+field('Photos (up to 4)','files','file','','multiple accept="image/*"'),'Submit',async(e,f)=>{const v=getVals(f),files=[...f.files.files];if(files.length>4)throw Error('Choose up to 4 photos');const photos=await Promise.all(files.map(photoData));const t={...v,files:undefined,photos,id:'R-'+uid().slice(0,6),device:m.id,status:'Pending',at:stamp()};d.repairs.unshift(t);deviceLog(m,'Repair requested · '+t.id);commit('Repair request saved');go('repairDetail',{id:t.id},true)})))};

routes.stock=a=>{const q=(a.q||'').toLowerCase(),list=d.devices.filter(m=>(m.name+' '+m.id+' '+m.site).toLowerCase().includes(q));return shell('Select Device',searchField(a.q,'Device name/id/SN',v=>{a.q=v;refresh()})+`<div class="section-head">${link('Restock Plans',()=>go('plans'))}${link('Restock Records',()=>go('records'))}</div>`+(list.map(m=>deviceCard(m,()=>chooseStock(m))).join('')||empty()),{nav:'stock',backButton:!!historyStack.length})};
function chooseStock(m,planId=''){sheet('Restock mode',`<div class="mode-list">${['Quick Restock','Fine Restock'].map((mode,i)=>`<button ${action(()=>{const p=d.plans.find(x=>x.id===planId);draft.stock={device:m.id,mode,planId,door:1,shelf:1,before:m.slots.map(s=>s.qty),after:m.slots.map((s,j)=>p?.targets?.[m.id]?.[j]??s.qty),cap:m.slots.map(s=>s.cap),signature:JSON.stringify(m.slots)};go(i?'count':'stockEdit')})}><strong>${mode}</strong><span class="small">${i?'Count current stock before adjusting quantities.':'Adjust quantities using the current inventory.'}</span></button>`).join('')}</div>`)}
function shelfNav(model,state){const set=(k,v)=>{state[k]=v;refresh()};return (model.doors===2?tabs(['Left door','Right door'],state.door===1?'Left door':'Right door',v=>set('door',v==='Left door'?1:2)):'')+tabs(Array.from({length:model.shelves},(_,i)=>'Layer '+(i+1)),'Layer '+state.shelf,v=>set('shelf',+v.split(' ')[1]))}
function quantityRows(counting){const st=draft.stock,m=findDevice(st.device);return m.slots.map((s,j)=>{if(s.door!==st.door||s.shelf!==st.shelf)return '';const p=product(s.pid),max=s.cap,current=counting?st.before:st.after;return card(`<div class="section-head"><small>${String.fromCharCode(64+s.shelf)}${j+1}</small><span class="small">${counting?'Starting count':'Current Stock'}</span></div><div class="flex">${pic(p?.art,52)}<div class="row-main"><b>${E(p?.name||'Empty slot')}</b><span class="sub">Pre-restock stock: ${st.before[j]}/${max}</span></div></div><div class="flex between" style="margin-top:12px">${counting?'':link('Edit starting count',()=>sheet('Edit starting count',form(field('Actual quantity','qty','number',st.before[j],`required min="0" max="${max}" step="1"`),'Save',(e,f)=>{st.before[j]=+getVals(f).qty;refresh()})))}<div class="stepper">${btn('−',()=>{current[j]=Math.max(0,current[j]-1);refresh()},'')}<input aria-label="Quantity" type="number" min="0" max="${max}" step="1" data-qty="${j}" data-count="${counting?1:0}" value="${current[j]}">${btn('+',()=>{current[j]=Math.min(max,current[j]+1);refresh()},'')}</div></div>`)}).join('')}
document.addEventListener('change',e=>{if(e.target.matches('[data-qty]')){const i=+e.target.dataset.qty,st=draft.stock;const v=Math.min(st.cap[i],Math.max(0,Math.trunc(Number(e.target.value)||0)));(e.target.dataset.count==='1'?st.before:st.after)[i]=v;e.target.value=v}});
routes.count=()=>{const st=draft.stock,m=findDevice(st.device);return shell('Count Before Restocking',`<p class="info">Check the cabinet inventory before adding or removing items.</p>`+shelfNav(m,st)+quantityRows(true),{footer:btn('Confirm Starting Count',()=>{st.after=[...st.before];go('stockEdit')})+link('Skip (use system count)',()=>{st.before=m.slots.map(s=>s.qty);go('stockEdit')})})};
routes.stockEdit=()=>{const st=draft.stock,m=findDevice(st.device);return shell('Stock',card(`<div class="flex">${pic(m.photo,42)}<div class="row-main"><b>${E(m.name)}</b><span class="sub">${E(m.id)}</span></div>${btn('Unlock',()=>remote(m,'Unlock'),'pill-btn')}</div>`)+shelfNav(m,st)+quantityRows(false),{footer:`<div class="buttons" style="margin:0">${btn('Full Restock',()=>{st.after=m.slots.map(s=>s.cap);refresh()},'outline')}${btn('Confirm',()=>go('stockConfirm'))}</div>`})};
routes.stockConfirm=()=>{const st=draft.stock,m=findDevice(st.device);const changes=m.slots.map((s,i)=>({slot:s,index:i})).filter(({index:i,slot:s})=>st.after[i]!==s.qty||st.before[i]!==s.qty);return shell('Confirm Restock',card(row('Device',m.name)+row('Mode',st.mode)+row('Changed slots',changes.length)+changes.map(({slot:s,index:i})=>row(`${s.door===1?'L':'R'} · Layer ${s.shelf} · ${product(s.pid)?.name}`,`${st.before[i]} → ${st.after[i]}`)).join(''))+card(form(area('Notes','notes',st.notes||'','maxlength="200"')+field('Planogram photo (optional)','photo','file','','accept="image/*"'),'Complete Restock',async(e,f)=>{if(!changes.length)throw Error('Adjust at least one slot');if(JSON.stringify(m.slots)!==st.signature)throw Error('Inventory changed. Reopen the device to restock.');const photo=await photoData(f.photo.files[0]);const record={id:'RS-'+uid().slice(0,7),device:m.id,at:stamp(),mode:st.mode,notes:getVals(f).notes,photo,changes:changes.map(({slot:s,index:i})=>({name:product(s.pid)?.name,door:s.door,shelf:s.shelf,before:st.before[i],after:st.after[i]}))};m.slots.forEach((s,i)=>s.qty=st.after[i]);d.records.unshift(record);deviceLog(m,st.mode+' · '+record.id);const p=d.plans.find(x=>x.id===st.planId);if(p){p.done=Array.from(new Set([...p.done,m.id]));if(p.done.length===p.devices.length)p.status='Completed'}commit('Restock complete');draft.stock=null;root('records')})))};
routes.records=()=>shell('Restock Records',d.records.map(r=>card(row(findDevice(r.device)?.name||r.device,r.mode,()=>go('record',{id:r.id}))+`<span class="small">${E(r.id)} · ${when(r.at)}</span>`)).join('')||empty('No restock records yet'),{extra:link('Restock',()=>root('stock'))});
routes.record=a=>{const r=d.records.find(x=>x.id===a.id);return shell('Restock details',card(row('Device',r.device)+row('Mode',r.mode)+row('Time',when(r.at))+row('Notes',r.notes||'—')+r.changes.map(l=>row(`${l.door===1?'L':'R'}${l.shelf} · ${l.name}`,l.before+' → '+l.after)).join('')+(r.photo?`<img width="100%" src="${E(r.photo)}" alt="Planogram photo">`:'')))};
routes.plans=()=>shell('Restock Plans',(d.plans.map(p=>card(row(p.name,p.status,()=>go('planDetail',{id:p.id}))+`<span class="small">${E(p.date)} · ${E(p.person)} · ${p.devices.length} devices</span>`)).join('')||empty('No restock plans yet')),{extra:link('Generate',()=>go('newPlan'))});
routes.newPlan=a=>{const p=d.plans.find(p=>p.id===a.id),allowed=d.devices;return shell(p?'Edit restock plan':'Generate Restock Plan',card(form(field('Plan name','name','text',p?.name||'Restock · '+today(),'required')+field('Scheduled date','date','date',p?.date||today(),'required')+sel('Restocker','person',d.staff.map(s=>s.name).concat(db.profile.name),p?.person)+`<h2>Select devices</h2>`+allowed.map(m=>`<label class="row"><span>${E(m.name)}</span><input type="checkbox" name="machine" value="${E(m.id)}" ${p?.devices.includes(m.id)||!p&&low(m)?'checked':''}></label>`).join(''),'Save plan',(e,f)=>{const v=getVals(f),ids=new FormData(f).getAll('machine');if(!ids.length)throw Error('Select at least one device');const plan=p||{id:'PL-'+uid().slice(0,6),status:'Scheduled',done:[]};Object.assign(plan,{name:v.name,date:v.date,person:v.person,devices:ids,targets:Object.fromEntries(ids.map(id=>[id,findDevice(id).slots.map(s=>s.cap)]))});if(!p)d.plans.unshift(plan);commit('Plan saved');go('planDetail',{id:plan.id},true)})))};
routes.planDetail=a=>{const p=d.plans.find(x=>x.id===a.id);return shell('Restock plan',card(row('Plan',p.name)+row('Status',p.status)+row('Restocker',p.person)+row('Scheduled date',p.date))+card(p.devices.map(id=>row(findDevice(id).name,p.done.includes(id)?'Completed':p.status==='Ready'?'Restock':'View quantities',()=>{if(p.status==='Ready'&&!p.done.includes(id)){chooseStock(findDevice(id),p.id);return}planTargets(p,findDevice(id))})).join(''))+(p.status==='Scheduled'?`<div class="buttons">${btn('Modify',()=>go('newPlan',a),'outline')}${btn('Start sorting',()=>{p.status='Sorting';commit();refresh()})}</div>`:p.status==='Sorting'?btn('Confirm sorting complete',()=>{p.status='Ready';commit('Ready to restock');refresh()}):''))};



function saveLayoutEditor(model,template=false){draft.layout={id:model.id,template,door:1,shelf:1,slots:copy(model.slots),name:model.name,doors:model.doors,shelves:model.shelves}}
routes.layout=a=>{if(!draft.layout||draft.layout.id!==a.id||draft.layout.template!==!!a.template)saveLayoutEditor(a.template?d.templates.find(x=>x.id===a.id):findDevice(a.id),!!a.template);const st=draft.layout,items=st.slots.map((s,i)=>[s,i]).filter(([s])=>s.door===st.door&&s.shelf===st.shelf);return shell(st.template?'Edit template':'Planogram',card(row(st.name,`${st.doors} Doors · ${st.shelves} shelves`))+shelfNav(st,st)+(items.map(([s,i])=>{const p=product(s.pid);return card(`<div class="flex">${pic(p?.art)}<div class="row-main"><b>${E(p?.name||'Product')}</b><span class="sub">Capacity ${s.cap} · Stock ${s.qty}</span><span class="sub">${cash(s.price??p?.price)} · ${E(p?.barcode)}</span></div>${link('Edit',()=>editSlot(st,i))}</div>`)}).join('')||empty('No products on this shelf'))+btn('Add product',()=>editSlot(st,-1),'outline')+(st.template?'':card(row('Import','From device or template',()=>importLayout(st))+row('Save as template','',()=>saveTemplate(st)))),{footer:btn('Save',()=>{const model=st.template?d.templates.find(x=>x.id===st.id):findDevice(st.id);if(!model)throw Error('Source unavailable');model.slots=copy(st.slots);if(!st.template)deviceLog(model,'Planogram updated');commit('Layout saved');draft.layout=null;back()})})};
function editSlot(st,i){const s=st.slots[i]||{door:st.door,shelf:st.shelf,cap:12,qty:0,pid:d.products[0]?.id};if(!d.products.length)throw Error('Add a product to your library first');sheet(i<0?'Add product':'Edit product slot',form(sel('Product','pid',d.products.map(p=>[p.id,p.name]),s.pid)+sel('Door','door',Array.from({length:st.doors},(_,i)=>[String(i+1),i?'Right door':'Left door']),String(s.door))+field('Shelf','shelf','number',s.shelf,`min="1" max="${st.shelves}" required`)+field('Capacity','cap','number',s.cap,'required min="1" max="999" step="1"')+field('Current stock','qty','number',s.qty,'required min="0" step="1"')+field('Sale price','price','number',s.price??product(s.pid)?.price??0,'required min="0" step=".01"'),'Apply',(e,f)=>{const v=getVals(f);if(+v.qty>+v.cap)throw Error('Stock exceeds capacity');const item={pid:v.pid,door:+v.door,shelf:+v.shelf,cap:+v.cap,qty:+v.qty,price:+v.price};if(i<0)st.slots.push(item);else st.slots[i]=item;st.door=item.door;st.shelf=item.shelf;refresh()})+(i>=0?link('Remove from shelf',()=>confirmBox('Remove product?','Remove this slot from the current layout draft.',()=>{st.slots.splice(i,1);refresh()})):''))}
function saveTemplate(st){sheet('Save as template',form(field('Template name','name','text','','required maxlength="60"'),'Save',(e,f)=>{d.templates.unshift({id:uid(),name:getVals(f).name,doors:st.doors,shelves:st.shelves,slots:copy(st.slots)});commit('Template saved');refresh()}))}
function importLayout(st,tab='From Template'){const src=tab==='From Template'?d.templates:d.devices.filter(x=>x.id!==st.id);sheet('Import planogram',tabs(['From Device','From Template'],tab,t=>importLayout(st,t))+src.map(x=>row(x.name,`${x.doors} doors / ${x.shelves} shelves`,()=>{if(x.doors!==st.doors||x.shelves!==st.shelves)throw Error('Door or shelf configuration does not match');confirmBox('Overwrite planogram?',`Replace the current draft with ${x.name}?`,()=>{st.slots=copy(x.slots);refresh();toast('Imported. Save to apply.')})})).join(''))}
routes.templates=()=>shell('Planogram template',d.templates.map(t=>card(row(t.name,`${t.doors}D · ${t.shelves} shelves`,()=>{draft.layout=null;go('layout',{id:t.id,template:true})})+`<div class="flex between">${link('Rename',()=>sheet('Rename template',form(field('Name','name','text',t.name,'required'),'Save',(e,f)=>{t.name=getVals(f).name;commit();refresh()})))}${link('Apply to device',()=>sheet('Select device',d.devices.map(m=>row(m.name,`${m.doors}D / ${m.shelves}`,()=>{if(m.doors!==t.doors||m.shelves!==t.shelves)throw Error('Incompatible door or shelf count');confirmBox('Apply template?',`Replace the planogram on ${m.name}?`,()=>{m.slots=copy(t.slots);deviceLog(m,'Applied template '+t.name);commit('Template applied');refresh()})})).join('')))}${link('Delete',()=>confirmBox('Delete template?',t.name,()=>{d.templates=d.templates.filter(x=>x.id!==t.id);commit();refresh()}))}</div>`)).join('')||empty(),{extra:link('Add',()=>sheet('New template',form(field('Name','name','text','','required')+sel('Device model','model',['G1200 · 2 doors / 6 shelves','G620H · 1 door / 4 shelves']),'Create',(e,f)=>{const v=getVals(f);d.templates.unshift({id:uid(),name:v.name,doors:v.model.startsWith('G1200')?2:1,shelves:v.model.startsWith('G1200')?6:4,slots:[]});commit();refresh()})))});
routes.products=a=>{const cloud=a.tab==='Cloud Library',q=(a.q||'').toLowerCase(),items=(cloud?catalog:d.products).filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q)&&(!a.cat||a.cat==='All'||p.category===a.cat));return shell('Product Library',tabs(['Private Library','Cloud Library'],cloud?'Cloud Library':'Private Library',t=>{a.tab=t;refresh()})+'<div class="search-line">'+searchField(a.q,'Product name/Barcode',v=>{a.q=v;refresh()})+`<button aria-label="Scan barcode" ${action(()=>scanBarcode(code=>{a.q=code;refresh()}))}>${img('scan',23)}</button></div>`+tabs(['All','Drinks','Snacks','Other'],a.cat||'All',v=>{a.cat=v;refresh()})+(items.map(p=>card(`<div class="flex">${pic(p.art,68)}<div class="row-main"><strong>${E(p.name)}</strong><span class="sub">${E(p.barcode)} | ${E(p.category)}</span><span class="link">${cash(p.price)}</span></div></div><div class="flex" style="justify-content:flex-end;margin-top:10px">${link('Barcode',()=>sheet('Product barcode',barcodeImage(p.barcode)+`<p class="big center">${E(p.barcode||'No barcode')}</p>`))}${cloud?btn(d.products.some(x=>x.id===p.id)?'In library':'Add to library',()=>{if(!d.products.some(x=>x.id===p.id)){d.products.push(copy(p));commit('Product added');refresh()}else toast('Already in library')},'pill-btn'):btn('Edit',()=>editProduct(p),'pill-btn')}</div>`)).join('')||empty('No matching products')),{extra:link('New',()=>go('newProduct'))})};
function editProduct(p){sheet('Edit product',form(field('Product name','name','text',p.name,'required')+field('Barcode','barcode','text',p.barcode,'required')+field('Sale price','price','number',p.price,'required min="0" step=".01"')+sel('Category','category',['Snacks','Drinks','Other'],p.category),'Save',(e,f)=>{const v=getVals(f);if(d.products.some(x=>x.id!==p.id&&x.barcode===v.barcode))throw Error('Barcode already exists');Object.assign(p,v,{price:+v.price});commit();refresh()})+link('Delete product',()=>confirmBox('Delete product?',p.name,()=>{if(d.devices.some(m=>m.slots.some(s=>s.pid===p.id))||d.templates.some(t=>t.slots.some(s=>s.pid===p.id)))throw Error('Remove this product from devices and templates first');d.products=d.products.filter(x=>x.id!==p.id);commit();refresh()})))}
